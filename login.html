<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk / Buat Akun - SIDOTI</title>
  <link rel="icon" type="image/jpeg" href="/assets/img/logo-sidoti.jpg" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-glass-card {
      max-width: 460px;
      width: 100%;
      padding: 36px 32px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(31, 38, 135, 0.08);
    }

    .auth-tabs-box {
      display: flex;
      gap: 6px;
      background: rgba(226, 232, 240, 0.6);
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 24px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--slate);
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-tab-btn.active {
      background: #FFFFFF;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }

    .auth-remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 22px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header id="navbar"></header>

  <main class="auth-wrapper">
    <div class="auth-glass-card">
      <div style="text-align: center; margin-bottom: 26px;">
        <h1 style="font-size: 26px; margin-bottom: 8px;">Selamat datang</h1>
        <p style="font-size: 13px; color: var(--slate); line-height: 1.6; margin: 0;">
          Masuk atau buat akun untuk melanjutkan langkah kecil berbagi kebahagiaan.
        </p>
      </div>

      <div class="auth-tabs-box">
        <button id="tab-login" type="button" class="auth-tab-btn active">Masuk</button>
        <button id="tab-register" type="button" class="auth-tab-btn">Buat Akun</button>
      </div>

      <div id="alert-box" style="margin-bottom: 16px;"></div>

      <!-- Form Login -->
      <form id="form-login">
        <div class="form-group">
          <label for="login-email">Email</label>
          <div class="input-wrapper with-left-icon">
            <svg class="input-icon left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              type="email"
              id="login-email"
              placeholder="nama@email.com"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrapper with-left-icon with-right-icon">
            <svg class="input-icon left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="login-password"
              placeholder="Masukkan password Anda"
              required
              autocomplete="current-password"
              minlength="6"
            />
            <svg class="input-icon right" id="toggle-password" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="cursor: pointer;">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>

        <div class="auth-remember-row">
          <div class="checkbox-group" style="margin: 0;">
            <input type="checkbox" id="remember" />
            <label for="remember">Ingat saya</label>
          </div>
          <a href="#" onclick="alert('Silakan hubungi admin SIDOTI untuk reset password.'); return false;" style="color: var(--primary); font-weight: 600;">
            Lupa password?
          </a>
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary lg">Masuk</button>
      </form>

      <!-- Form Register -->
      <form id="form-register" style="display: none;">
        <div class="form-group">
          <label for="reg-nama">Nama Lengkap</label>
          <div class="input-wrapper with-left-icon">
            <svg class="input-icon left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input
              type="text"
              id="reg-nama"
              placeholder="Masukkan nama lengkap"
              required
              minlength="2"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">Email</label>
          <div class="input-wrapper with-left-icon">
            <svg class="input-icon left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              type="email"
              id="reg-email"
              placeholder="nama@email.com"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <div class="input-wrapper with-left-icon">
            <svg class="input-icon left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="reg-password"
              placeholder="Minimal 6 karakter"
              required
              autocomplete="new-password"
              minlength="6"
            />
          </div>
        </div>

        <button type="submit" id="btn-register" class="btn btn-primary lg">Buat Akun</button>
      </form>

      <p style="text-align: center; font-size: 13px; color: var(--slate); margin-top: 22px;">
        <span id="switch-text">Belum punya akun?</span>
        <a id="switch-tab" href="#" style="color: var(--primary); font-weight: 700;">Daftar sekarang</a>
      </p>

      <div style="text-align: center; font-size: 12px; color: var(--slate); margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-subtle);">
        Pengelola / Admin? <a href="/admin/login.html" style="color: var(--primary); font-weight: 700;">Masuk ke Panel Admin →</a>
      </div>
    </div>
  </main>

  <footer class="footer" style="margin-top: 24px;">
    <div class="container">
      <div class="footer-left">© 2026 SIDOTI. Bersama, hadirkan lebih banyak kebaikan.</div>
      <div class="footer-right">
        <a href="#" class="footer-link">Kebijakan Privasi</a>
        <a href="#" class="footer-link">Hubungi Kami</a>
      </div>
    </div>
  </footer>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/login.js"></script>
</body>
</html>
